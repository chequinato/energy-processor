name: CI - Energy Data Processor

on:
  push:
    branches: ["main", "develop"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependências backend
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Testes (pytest)
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Build Docker Compose
        run: docker compose build

      - name: Subir containers e aguardar healthchecks
        run: docker compose up -d --wait --wait-timeout 120

      - name: Verificar /health da API
        run: curl --fail --silent http://localhost:8000/health

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs

      - name: Derrubar containers
        if: always()
        run: docker compose down
